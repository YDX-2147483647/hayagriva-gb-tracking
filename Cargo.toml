[package]
name = "hayagriva-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "hayagriva"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies]
hayagriva = { git = "https://github.com/typst/hayagriva", version = "0.10.0", features = ["csl-json", "archive", "biblatex"], default-features = false, tag = "v0.10.0" }
serde_json = "1.0.149"

[dependencies.pyo3]
version = "0.28.2"
# "abi3-py310" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.10
features = ["abi3-py310"]
