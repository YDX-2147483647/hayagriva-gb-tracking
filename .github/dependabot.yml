    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 10
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 10
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 10
  - package-ecosystem: npm
    directory: /website/
    schedule:
      interval: quarterly
    cooldown:
      default-days: 10
