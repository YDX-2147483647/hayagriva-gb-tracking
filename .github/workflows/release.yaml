  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            Cargo.lock
      - name: Determine hayagriva source and version
        id: haya
        shell: python
        env:
          # For GitHub CLI
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json
          import tomllib
          from datetime import UTC, datetime
          from os import getenv
          from pathlib import Path
          from subprocess import run
          from urllib.parse import parse_qs, urlparse


          def write_output(key: str, value: str) -> None:
              github_output = getenv("GITHUB_OUTPUT")
              assert github_output is not None
              with open(github_output, "a", encoding="utf-8") as f:
                  print(f"{key}={value}", file=f)


          cargo_packages = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))["package"]
          source = next(pkg for pkg in cargo_packages if pkg["name"] == "hayagriva")["source"]
          assert source.startswith("git+https://")
          write_output("source", source)


          url = urlparse(source)
          query = parse_qs(url.query)
          if "tag" in query:
              name = query["tag"][0]
          else:
              assert "branch" in query
              branch = query["branch"][0]
              commit = url.fragment

              response = json.loads(
                  run(
                      ["gh", "api", f"/repos/typst/hayagriva/commits/{commit}"],
                      text=True,
                      check=True,
                      capture_output=True,
                  ).stdout
              )
              committer_date = (
                  datetime.fromisoformat(response["commit"]["committer"]["date"])
                  .astimezone(UTC)
                  .date()
                  .isoformat()
              )
              name = f"{branch}.{committer_date}.{commit[:7]}"
          write_output("version", name)

      - name: Download all artifacts
        uses: actions/download-artifact@v7
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: hayagriva-py-${{ steps.haya.outputs.version }}
          name: hayagriva-py ${{ steps.haya.outputs.version }}
          body: |
            hayagriva source:
            ${{ steps.haya.outputs.source }}
          files: |
            Cargo.lock
            wheels-*/hayagriva_py-*
      - run: |
          echo "🎉 Created a release for hayagriva-py ${{ steps.haya.outputs.version }}. Please publish [the draft release](${{ github.server_url }}/${{ github.repository }}/releases)." >> "$GITHUB_STEP_SUMMARY"
